    <nav class="navbar">

    <main class="content-wrapper">
        <a href="kurser.html" class="back-button">← TILBAGE</a>

        <section class="form-container">
            <h1>Tilmeld dig og start dit rygestop:</h1>
            
            <form>
                <div class="input-group">
                    <input type="text" placeholder="Navn" aria-label="Navn">
                </div>
                
                <div class="input-group">
                    <input type="tel" placeholder="Telefonnummer" aria-label="Telefonnummer">
                </div>
                
                <div class="input-group">
                    <input type="email" placeholder="E-mail" aria-label="E-mail">
                </div>

                <button type="submit" class="submit-btn">Tilmeld dig nu</button>
            </form>

            <div class="info-footer">
                <span>Uforpligtende og gratis tilmelding</span>
                <div class="checkmark">
                    <img src="Billede/check.png" alt="Check Icon" class="check-icon">
                </div>
            </div>
        </section>
    </main>

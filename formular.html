<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Rygestop Tilmelding - Herning Kommune</title>
    <link rel="stylesheet" href="style-formular.css">
    <link href="https://fonts.googleapis.com/css2?family=Jacques+Francois&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
</head>
<body>


    <nav class="navbar">
    <a href="#"><img class="site-logo" src="Billede/hk_byvaaben_neg-uden-tekst.png" alt="Logo"></a>
        <b href="#">KURSER</b>
        <a href="#">TEST DIG SELV</a>
        <a href="#">UDTAGELSER</a>
        <a href="#">TIPS & RÅD</a>
    </nav>

    <main class="content-wrapper">
        <a href="#" class="back-button">← TILBAGE</a>

        <section class="form-container">
            <h1>Tilmeld dig og start dit rygestop:</h1>
            
            <form>
                <div class="input-group">
                    <input type="text" placeholder="Navn" aria-label="Navn">
                </div>
                
                <div class="input-group">
                    <input type="tel" placeholder="Telefonnummer" aria-label="Telefonnummer">
                </div>
                
                <div class="input-group">
                    <input type="email" placeholder="E-mail" aria-label="E-mail">
                </div>

                <button type="submit" class="submit-btn">Tilmeld dig nu</button>
            </form>

            <div class="info-footer">
                <span>Uforpligtende og gratis tilmelding</span>
                <div class="checkmark">
                    <img src="https://placehold.co/40x40" alt="Check Icon" class="check-icon">
                </div>
            </div>
        </section>
    </main>


    <footer class="main-footer">
        <div class="footer-info">
            <p>Dette side er til undervisningsbrug</p>
            <address>
                Herning kommune:<br>
                Torvet 5, 7400 Herning<br>
                CVR: 29 18 99 19
            </address>
        </div>
        <div class="footer-socials">
            <img src="https://placehold.co/36x36" alt="facebook">
            <img src="https://placehold.co/36x36" alt="instagram">
            <img src="https://placehold.co/36x36" alt="LinkedIn">
        </div>
    </footer>

</body>
</html>
